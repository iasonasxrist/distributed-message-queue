version: "3.8"

services:
  zookeeper:
    image: zookeeper
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_HOST=zookeeper:2181
      - REGISTRATION_ZK_PATH="topics"
      - num_partitions=3

    networks:
      - distributed-queue
    restart: always

  producer:
    build:
      context: ./
      dockerfile: ./producer/Dockerfile
    ports:
      - 5005:5001
    environment:
      - ZOOKEEPER_HOST=zookeeper:2181
      - PRODUCER_PORT=5001
      - num_partitions=3
    networks:
      - distributed-queue
    depends_on:
      - zookeeper
      - broker

  broker:
    build:
      context: ./
      dockerfile: ./broker/Dockerfile
    deploy:
      replicas: 3
    ports:
      - "6000-6002:5000" 

    environment:
      - BROKER_PORT=5000
      - ZOOKEEPER_HOST=zookeeper:2181

    networks:
      - distributed-queue
    depends_on:
      - zookeeper

networks:
  distributed-queue:
