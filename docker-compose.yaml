version: "3"

services:
  zookeeper:
    image: zookeeper
    ports:
      - "2181:2181"
    restart: always

    networks:
      - distributed-queue

  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    expose:
      - "5000"
    networks:
      - distributed-queue
    depends_on:
      - zookeeper





networks:
  distributed-queue:
